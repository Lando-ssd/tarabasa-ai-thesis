; Settings for the live server (loaded after PHP's own defaults).
; The plain PHP defaults allow only 2 MB per uploaded file, which is tighter than the app's own
; rules (a photo up to 2 MB, a reading recording up to 15 MB), so a slightly large recording or photo
; would be refused by PHP before the app could even look at it.
upload_max_filesize = 16M
post_max_size = 20M
memory_limit = 256M
; Do not tell visitors which PHP version is running.
expose_php = Off
; Plenty for the biggest form (every placement answer, every checkbox), small enough to bound abuse.
max_input_vars = 3000
