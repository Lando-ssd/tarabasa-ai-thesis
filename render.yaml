# Render Blueprint for TaraBasa AI (free web service, Docker).
#
# This file is only used by Render. Railway keeps deploying exactly as before from railway.json and
# the same Dockerfile; nothing here changes how Railway builds or runs the app, so the two hosts can
# be switched between by changing where the variables point (see "How to switch hosts" in CLAUDE.md).
#
# Values marked `sync: false` are secrets or per-account details: Render asks for them in its
# dashboard when the Blueprint is created. They are never stored in this file.
#
# Database: TiDB Cloud (MySQL compatible, TLS required). The app's Dockerfile already installs the
# system certificate bundle, so MYSQL_ATTR_SSL_CA points at it.

services:
  - type: web
    name: tarabasa-ai
    runtime: docker
    plan: free
    # Same region as the TiDB cluster (AWS ap-southeast-1, Singapore). A page makes about 15 to 25 database
    # queries, so a web service in another region (about 170 ms per query) would take 3 to 5 seconds a page;
    # in the same region it is a few milliseconds a query. A service's region cannot be changed later.
    region: singapore
    branch: claude/admin-dashboard-approvals-62dcd0
    dockerfilePath: ./Dockerfile
    # NO healthCheckPath, on purpose (it used to be /up). Render then only checks that the port accepts a connection, which a busy
    # server still does. With an HTTP path, Render asked /up every few seconds and, when it was not answered within 5 SECONDS, stopped
    # sending traffic to the instance after 15 seconds (every visitor gets a 502) and restarted it after 60 seconds. The server is
    # `php artisan serve` on a 0.1 CPU free instance, and it ran ONE worker, not the 4 that docker/entrypoint.sh asked for: Laravel
    # ignores PHP_CLI_SERVER_WORKERS unless it is also given --no-reload (the deploy log said "Only creating a single server"). So a
    # single slow request (a recording being scored, a sleeping service being woken) left /up, and everyone else, unanswered. Render's Events on 2026-10-22 and 2026-10-23 were all
    # "HTTP health check failed (timed out after 5 seconds) while running your code", each followed by "Service recovered".
    # The setting that counts is the one in the Render dashboard (Settings, Health Check Path): clear it there as well.
    # The cost: a server that hangs completely, with the port still open, is no longer restarted by Render by itself.
    autoDeploy: true
    envVars:
      # ---- the app
      - key: APP_NAME
        value: TaraBasa AI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false          # php artisan key:generate --show   (or the same key Railway used)
      - key: APP_URL
        sync: false          # https://<your-service-name>.onrender.com   (no trailing slash)
      - key: LOG_CHANNEL
        value: stderr        # so errors show in Render's log viewer
      - key: LOG_LEVEL
        value: warning
      - key: BCRYPT_ROUNDS
        value: "10"          # a free instance is small; 10 is still a sound cost and keeps logins quick

      # ---- database: TiDB Cloud
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt

      # ---- sessions, cache and the job queue all live in the database (the disk is wiped on every sleep)
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: QUEUE_POP_LOCK
        value: plain         # TiDB has no "FOR UPDATE SKIP LOCKED"; see app/Queue/PlainLockDatabaseQueue.php

      # ---- email: Gmail's own API over HTTPS (SMTP ports are blocked on Render's free tier)
      - key: MAIL_MAILER
        value: gmail-api
      - key: MAIL_FROM_ADDRESS
        value: tarabasaai.noreply@gmail.com
      - key: MAIL_FROM_NAME
        value: TaraBasa AI
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false          # https://<your-service-name>.onrender.com/auth/google/callback
      - key: GMAIL_SEND_REFRESH_TOKEN
        sync: false

      # ---- the three teammate services (all on their own hosts, unchanged)
      - key: ACTIVITY_AI_URL
        value: https://acitvity-api.onrender.com
      - key: ACTIVITY_AI_KEY
        sync: false
      - key: READING_AI_URL
        value: https://reading-api-v5fp.onrender.com
      - key: ADAPTIVE_RECOMMENDER_URL
        value: https://adaptive-recommendator.onrender.com
      - key: ADAPTIVE_RECOMMENDER_KEY
        sync: false

      # ---- the legal pages (/privacy, /terms, /cookies, /refunds, /parent-consent); all optional, see config/legal.php
      # An address people can write to about their information. Without it the pages tell people to ask the school administrator
      # or the team instead, so set it as soon as the mailbox exists.
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      # Printed on every legal page after "run by" (for example the school or university and a postal address).
      - key: LEGAL_OPERATOR_DETAIL
        sync: false
      # The person accountable for following the Data Privacy Act (Section 21(b)), if the team names one.
      - key: LEGAL_ACCOUNTABLE_PERSON
        sync: false
      # Turn on (true) once every phone has app build 0.5.5, which sends the consent boxes. The website always requires them.
      - key: API_CONSENT_REQUIRED
        value: "false"

      # ---- the one Admin account (created or updated at every start; 12+ characters)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
