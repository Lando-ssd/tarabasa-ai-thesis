<rect x="25.0" y="377.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="401.7" font-size="12" text-anchor="middle" fill="#1F2937">See a short message. After 5 wrong tries wait 15</text><text x="174.9" y="416.7" font-size="12" text-anchor="middle" fill="#1F2937">minutes; the parent is told</text>
<polygon points="544.8888888888889,461.0 674.8888888888889,489.0 544.8888888888889,517.0 414.8888888888889,489.0" fill="#FFF3D6" stroke="#E0B04A" stroke-width="1.6"/><text x="544.9" y="493.2" font-size="12" text-anchor="middle" fill="#1F2937">First reading check done?</text>
