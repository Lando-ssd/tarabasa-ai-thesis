<polyline points="291.0,842.0 291.0,866.0" fill="none" stroke="#44546A" stroke-width="1.4"/>
<polyline points="475.0,842.0 475.0,866.0" fill="none" stroke="#44546A" stroke-width="1.4"/>
<polyline points="659.0,842.0 659.0,866.0" fill="none" stroke="#44546A" stroke-width="1.4"/>
<polyline points="185.0,798.0 185.0,842.0 659.0,842.0" fill="none" stroke="#44546A" stroke-width="1.4"/>
<polyline points="107.0,842.0 185.0,842.0" fill="none" stroke="#44546A" stroke-width="1.4"/>
<polyline points="185.0,140.0 185.0,170.0" fill="none" stroke="#44546A" stroke-width="1.6"/>
<polygon points="185.0,170.0 181.0,162.0 189.0,162.0" fill="#44546A"/>
<polyline points="185.0,234.0 185.0,264.0" fill="none" stroke="#44546A" stroke-width="1.6"/>
<polygon points="185.0,264.0 181.0,256.0 189.0,256.0" fill="#44546A"/>
