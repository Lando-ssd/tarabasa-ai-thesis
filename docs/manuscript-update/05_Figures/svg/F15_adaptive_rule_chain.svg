<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1018" viewBox="0 0 760 1018" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="760" height="1018" fill="#FFFFFF"/>
<text x="24" y="30" font-size="19" font-weight="bold" fill="#0B5CAD">Adaptive reading support: from a recording to a decision</text>
<text x="24" y="50" font-size="12" fill="#5B6675">New figure. Every step is a written rule or a formula; there is no trained model. Numbers are the team&#x27;s own settings.</text>
<polyline points="350.0,108.0 368.0,108.0" fill="none" stroke="#B8C0CC" stroke-width="1.4" stroke-dasharray="6 4"/>
<polyline points="350.0,202.0 368.0,202.0" fill="none" stroke="#B8C0CC" stroke-width="1.4" stroke-dasharray="6 4"/>
<polyline points="350.0,296.0 368.0,296.0" fill="none" stroke="#B8C0CC" stroke-width="1.4" stroke-dasharray="6 4"/>
<polyline points="350.0,390.0 368.0,390.0" fill="none" stroke="#B8C0CC" stroke-width="1.4" stroke-dasharray="6 4"/>
