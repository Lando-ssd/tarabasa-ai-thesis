<polygon points="185.0,358.0 181.0,350.0 189.0,350.0" fill="#44546A"/>
<polyline points="185.0,422.0 185.0,452.0" fill="none" stroke="#44546A" stroke-width="1.6"/>
<polygon points="185.0,452.0 181.0,444.0 189.0,444.0" fill="#44546A"/>
<polyline points="185.0,516.0 185.0,546.0" fill="none" stroke="#44546A" stroke-width="1.6"/>
<polygon points="185.0,546.0 181.0,538.0 189.0,538.0" fill="#44546A"/>
<polyline points="185.0,610.0 185.0,640.0" fill="none" stroke="#44546A" stroke-width="1.6"/>
<polygon points="185.0,640.0 181.0,632.0 189.0,632.0" fill="#44546A"/>
<polyline points="185.0,704.0 185.0,734.0" fill="none" stroke="#44546A" stroke-width="1.6"/>
<polygon points="185.0,734.0 181.0,726.0 189.0,726.0" fill="#44546A"/>
<polygon points="36,76 350,76 334,140 20,140" fill="#E4F4F1" stroke="#79BDB5" stroke-width="1.6"/><text x="185.0" y="112.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">Recording from the phone or browser</text>
<text x="558.0" y="107.0" font-size="11" text-anchor="middle" fill="#5B6675">Audio file, up to 15 MB. A try shorter than 1 second or too quiet is not</text><text x="558.0" y="120.7" font-size="11" text-anchor="middle" fill="#5B6675">sent.</text>
<rect x="20" y="170" width="330" height="64" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="185.0" y="206.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">Reading service (Vosk) scores it</text>
<text x="558.0" y="201.0" font-size="11" text-anchor="middle" fill="#5B6675">Words heard with time and confidence, accuracy by word comparison,</text><text x="558.0" y="214.7" font-size="11" text-anchor="middle" fill="#5B6675">words a minute, voice score. The teammate&#x27;s service.</text>
<rect x="20" y="264" width="330" height="64" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="185.0" y="300.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">Accept same sound words</text>
<text x="558.0" y="295.0" font-size="11" text-anchor="middle" fill="#5B6675">sun and son, mangoes and mangos, 2 and two, sand + castle. Near</text><text x="558.0" y="308.7" font-size="11" text-anchor="middle" fill="#5B6675">misses (hit and hat) stay mistakes.</text>
<rect x="20" y="358" width="330" height="64" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="185.0" y="394.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">Leave faint words &#x27;not sure&#x27;</text>
<text x="558.0" y="389.0" font-size="11" text-anchor="middle" fill="#5B6675">Heard below 0.50 confidence and not matching: left out of the score and</text><text x="558.0" y="402.7" font-size="11" text-anchor="middle" fill="#5B6675">the word bank. At most 25 percent of the words.</text>
<rect x="20" y="452" width="330" height="64" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="185.0" y="488.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">Save the reading and word by word feedback</text>
<text x="558.0" y="483.0" font-size="11" text-anchor="middle" fill="#5B6675">Correct, skipped, a different word, mispronounced, said twice. Missed</text><text x="558.0" y="496.7" font-size="11" text-anchor="middle" fill="#5B6675">words go to the word bank.</text>
<polygon points="185.0,546 350,578.0 185.0,610 20,578.0" fill="#FFF3D6" stroke="#E0B04A" stroke-width="1.6"/><text x="185.0" y="582.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">Move the reading step?</text>
<text x="558.0" y="570.1" font-size="11" text-anchor="middle" fill="#5B6675">Up one step: 3 strong readings (90 percent or more, enough words) of at</text><text x="558.0" y="583.9" font-size="11" text-anchor="middle" fill="#5B6675">least 2 activities. Down one: 2 weak readings (under 70) in a row. Only</text><text x="558.0" y="597.6" font-size="11" text-anchor="middle" fill="#5B6675">readings after the last move count.</text>
<rect x="20" y="640" width="330" height="64" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="185.0" y="676.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">Adaptive recommender updates the profile</text>
<text x="558.0" y="671.0" font-size="11" text-anchor="middle" fill="#5B6675">Proficiency (moving average, 0.30), confidence (+0.08 per reading); picks</text><text x="558.0" y="684.7" font-size="11" text-anchor="middle" fill="#5B6675">the next competency and level.</text>
<rect x="20" y="734" width="330" height="64" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="185.0" y="770.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">Find the main mistake pattern</text>
<text x="558.0" y="758.1" font-size="11" text-anchor="middle" fill="#5B6675">Last 8 readings; 10 kinds (endings, vowels, first or last sounds, blends,</text><text x="558.0" y="771.9" font-size="11" text-anchor="middle" fill="#5B6675">small words, skipped words, longer words in pieces...). Needs 3 readings</text><text x="558.0" y="785.6" font-size="11" text-anchor="middle" fill="#5B6675">and 6 misses.</text>
<text x="558.0" y="819.9" font-size="11" font-weight="bold" text-anchor="middle" fill="#1F2937">What the decision changes: every screen reads the same result</text>
<rect x="20" y="866" width="174" height="100" rx="7" fill="#EEE9FA" stroke="#A894DA" stroke-width="1.5"/><text x="107.0" y="899.2" font-size="11" text-anchor="middle" fill="#1F2937">Learner</text><text x="107.0" y="913.0" font-size="11" text-anchor="middle" fill="#1F2937">Result, points, badges; &#x27;Picked</text><text x="107.0" y="926.7" font-size="11" text-anchor="middle" fill="#1F2937">just for you&#x27;; games use missed</text><text x="107.0" y="940.5" font-size="11" text-anchor="middle" fill="#1F2937">words first</text>
<rect x="204" y="866" width="174" height="100" rx="7" fill="#E4F4F1" stroke="#79BDB5" stroke-width="1.5"/><text x="291.0" y="899.2" font-size="11" text-anchor="middle" fill="#1F2937">Teacher</text><text x="291.0" y="913.0" font-size="11" text-anchor="middle" fill="#1F2937">Alerts, analytics, suggested</text><text x="291.0" y="926.7" font-size="11" text-anchor="middle" fill="#1F2937">activities, &#x27;Did it work?&#x27;, learner</text><text x="291.0" y="940.5" font-size="11" text-anchor="middle" fill="#1F2937">profile</text>
<rect x="388" y="866" width="174" height="100" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="475.0" y="906.1" font-size="11" text-anchor="middle" fill="#1F2937">Parent</text><text x="475.0" y="919.9" font-size="11" text-anchor="middle" fill="#1F2937">Plain level, &#x27;Practise at home&#x27;,</text><text x="475.0" y="933.6" font-size="11" text-anchor="middle" fill="#1F2937">alerts</text>
<rect x="572" y="866" width="174" height="100" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5"/><text x="659.0" y="906.1" font-size="11" text-anchor="middle" fill="#1F2937">Activity writer</text><text x="659.0" y="919.9" font-size="11" text-anchor="middle" fill="#1F2937">A short class basis: step, shared</text><text x="659.0" y="933.6" font-size="11" text-anchor="middle" fill="#1F2937">mistakes, words, interests</text>
<text x="24" y="1004" font-size="11" font-weight="bold" fill="#5B6675">LEGEND</text>
<rect x="80" y="993" width="16" height="12" rx="3" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.4"/>
<text x="102" y="1003" font-size="11" fill="#1F2937">Rule in TaraBasa</text>
<rect x="207.984375" y="993" width="16" height="12" rx="3" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.4"/>
<text x="229.984375" y="1003" font-size="11" fill="#1F2937">Outside service</text>
<rect x="328.984375" y="993" width="16" height="12" rx="3" fill="#FFF3D6" stroke="#E0B04A" stroke-width="1.4"/>
<text x="350.984375" y="1003" font-size="11" fill="#1F2937">Decision</text>
</svg>