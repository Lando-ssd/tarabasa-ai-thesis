<rect x="126.3913043478261" y="139.0" width="90" height="26" rx="13.0" fill="#0B5CAD" stroke="#0B5CAD" stroke-width="1.6"/><text x="171.4" y="156.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Activities</text>
<rect x="25.0" y="206.0" width="292.7826086956522" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="171.4" y="230.7" font-size="12" text-anchor="middle" fill="#1F2937">Ask for activities: grade, skill, kind, how many per</text><text x="171.4" y="245.7" font-size="12" text-anchor="middle" fill="#1F2937">level; optionally for a class</text>
<rect x="347.7826086956522" y="206.0" width="387.21739130434787" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="541.4" y="230.7" font-size="12" text-anchor="middle" fill="#1F2937">Check a credit is left; for a class, read its readings and write a short</text><text x="541.4" y="245.7" font-size="12" text-anchor="middle" fill="#1F2937">basis</text>
<rect x="25.0" y="288.0" width="292.7826086956522" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="171.4" y="320.2" font-size="12" text-anchor="middle" fill="#1F2937">Keep working; a notice shows the progress</text>
<rect x="347.7826086956522" y="288.0" width="387.21739130434787" height="56" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="541.4" y="312.7" font-size="12" text-anchor="middle" fill="#1F2937">AI activity writer (Gemini) writes drafts in the background (about 2</text><text x="541.4" y="327.7" font-size="12" text-anchor="middle" fill="#1F2937">minutes)</text>
<rect x="25.0" y="370.0" width="292.7826086956522" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="171.4" y="394.7" font-size="12" text-anchor="middle" fill="#1F2937">Review each draft: edit, place in Easy, Medium or</text><text x="171.4" y="409.7" font-size="12" text-anchor="middle" fill="#1F2937">Hard, or reject</text>
<rect x="347.7826086956522" y="370.0" width="387.21739130434787" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="541.4" y="402.2" font-size="12" text-anchor="middle" fill="#1F2937">Save the Teacher&#x27;s level next to the AI&#x27;s suggestion; show why</text>
<rect x="25.0" y="452.0" width="292.7826086956522" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="171.4" y="476.7" font-size="12" text-anchor="middle" fill="#1F2937">Assign to a learner, class, reading group or focus</text><text x="171.4" y="491.7" font-size="12" text-anchor="middle" fill="#1F2937">group</text>
<polygon points="541.3913043478261,527.0 681.3913043478261,562.0 541.3913043478261,597.0 401.3913043478261,562.0" fill="#FFF3D6" stroke="#E0B04A" stroke-width="1.6"/><text x="541.4" y="558.7" font-size="12" text-anchor="middle" fill="#1F2937">Can these children read it?</text><text x="541.4" y="573.7" font-size="12" text-anchor="middle" fill="#1F2937">(grade, length)</text>
<rect x="25.0" y="534.0" width="292.7826086956522" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="171.4" y="566.2" font-size="12" text-anchor="middle" fill="#1F2937">See the reason; choose another activity</text>
<rect x="347.7826086956522" y="616.0" width="387.21739130434787" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="541.4" y="648.2" font-size="12" text-anchor="middle" fill="#1F2937">Save the assignment</text>
<rect x="25.0" y="698.0" width="292.7826086956522" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="171.4" y="722.7" font-size="12" text-anchor="middle" fill="#1F2937">Share an approved activity to the Open Repository</text><text x="171.4" y="737.7" font-size="12" text-anchor="middle" fill="#1F2937">(free or paid)</text>
<rect x="347.7826086956522" y="698.0" width="387.21739130434787" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="541.4" y="730.2" font-size="12" text-anchor="middle" fill="#1F2937">List it once; add 2 free credits to the teacher</text>
<rect x="25.0" y="780.0" width="292.7826086956522" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="171.4" y="804.7" font-size="12" text-anchor="middle" fill="#1F2937">Later: see which activities helped the class</text><text x="171.4" y="819.7" font-size="12" text-anchor="middle" fill="#1F2937">(Analytics)</text>
