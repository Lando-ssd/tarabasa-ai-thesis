<rect x="250" y="290" width="260" height="70" rx="7" fill="#E4F4F1" stroke="#79BDB5" stroke-width="1.5"/><text x="380.0" y="314.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">Application server</text><text x="380.0" y="329.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">Laravel 13 on Render (Singapore)</text><text x="380.0" y="344.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">website, API, rules, worker</text>
<path d="M24,456 a100.0,8 0 0 1 200,0 v80 a100.0,8 0 0 1 -200,0 z" fill="#F3F5F8" stroke="#44546A" stroke-width="1.6"/><path d="M24,456 a100.0,8 0 0 0 200,0" fill="none" stroke="#44546A" stroke-width="1.4"/><text x="124.0" y="479.2" font-size="11" text-anchor="middle" fill="#1F2937">TiDB Cloud database</text><text x="124.0" y="493.0" font-size="11" text-anchor="middle" fill="#1F2937">MySQL compatible</text><text x="124.0" y="506.7" font-size="11" text-anchor="middle" fill="#1F2937">users, learners, readings,</text><text x="124.0" y="520.5" font-size="11" text-anchor="middle" fill="#1F2937">activities, alerts</text>
<rect x="280" y="464" width="432" height="24" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5"/><text x="496.0" y="479.9" font-size="11" text-anchor="middle" fill="#5B6675">HTTPS calls from the server (keys stay on the server)</text>
<rect x="276" y="504" width="218" height="54" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="385.0" y="528.0" font-size="11" text-anchor="middle" fill="#1F2937">Reading service (Vosk)</text><text x="385.0" y="541.7" font-size="11" text-anchor="middle" fill="#1F2937">scores each recording</text>
<rect x="506" y="504" width="218" height="54" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="615.0" y="528.0" font-size="11" text-anchor="middle" fill="#1F2937">Activity writer (Gemini)</text><text x="615.0" y="541.7" font-size="11" text-anchor="middle" fill="#1F2937">writes draft activities</text>
<rect x="276" y="574" width="218" height="54" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="385.0" y="598.0" font-size="11" text-anchor="middle" fill="#1F2937">Adaptive recommender</text><text x="385.0" y="611.7" font-size="11" text-anchor="middle" fill="#1F2937">updates profile, suggests next</text>
<rect x="506" y="574" width="218" height="54" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="615.0" y="598.0" font-size="11" text-anchor="middle" fill="#1F2937">Gmail API</text><text x="615.0" y="611.7" font-size="11" text-anchor="middle" fill="#1F2937">confirmation and reset emails</text>
<rect x="276" y="644" width="218" height="54" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="385.0" y="668.0" font-size="11" text-anchor="middle" fill="#1F2937">Google sign in</text><text x="385.0" y="681.7" font-size="11" text-anchor="middle" fill="#1F2937">(website, optional)</text>
<text x="134.0" y="596.4" font-size="11" text-anchor="middle" fill="#5B6675">The browser may send one harmless</text><text x="134.0" y="610.1" font-size="11" text-anchor="middle" fill="#5B6675">&#x27;wake up&#x27; request to the three AI</text><text x="134.0" y="623.9" font-size="11" text-anchor="middle" fill="#5B6675">services when a page opens,</text><text x="134.0" y="637.6" font-size="11" text-anchor="middle" fill="#5B6675">because free hosting lets them</text><text x="134.0" y="651.4" font-size="11" text-anchor="middle" fill="#5B6675">sleep. No key is on a device.</text>
<text x="24" y="728" font-size="11" font-weight="bold" fill="#5B6675">LEGEND</text>
