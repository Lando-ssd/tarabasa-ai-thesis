<rect x="23.999999999999986" y="272.0" width="218.66666666666666" height="46.0" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="133.3" y="291.7" font-size="12" text-anchor="middle" fill="#1F2937">See school, employee ID, grades and</text><text x="133.3" y="306.7" font-size="12" text-anchor="middle" fill="#1F2937">whether the email is confirmed</text>
<rect x="23.999999999999986" y="342.0" width="218.66666666666666" height="76.0" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="133.3" y="361.7" font-size="12" text-anchor="middle" fill="#1F2937">Check the email is confirmed and the</text><text x="133.3" y="376.7" font-size="12" text-anchor="middle" fill="#1F2937">details are right; then Approve, or</text><text x="133.3" y="391.7" font-size="12" text-anchor="middle" fill="#1F2937">Reject with a reason the teacher will</text><text x="133.3" y="406.7" font-size="12" text-anchor="middle" fill="#1F2937">see</text>
