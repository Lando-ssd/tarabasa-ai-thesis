<path d="M212,522 a75.0,8 0 0 1 150,0 v60 a75.0,8 0 0 1 -150,0 z" fill="#F3F5F8" stroke="#44546A" stroke-width="1.6"/><path d="M212,522 a75.0,8 0 0 0 150,0" fill="none" stroke="#44546A" stroke-width="1.4"/><text x="287.0" y="542.1" font-size="11" text-anchor="middle" fill="#1F2937">SQLite</text><text x="287.0" y="555.9" font-size="11" text-anchor="middle" fill="#1F2937">only on a developer&#x27;s</text><text x="287.0" y="569.6" font-size="11" text-anchor="middle" fill="#1F2937">computer</text>
<rect x="402" y="514" width="330" height="64" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="567.0" y="536.1" font-size="11" text-anchor="middle" fill="#1F2937">Reading service (Vosk)</text><text x="567.0" y="549.9" font-size="11" text-anchor="middle" fill="#1F2937">Reading-api v3, FastAPI on Render</text><text x="567.0" y="563.6" font-size="11" text-anchor="middle" fill="#1F2937">scores a recording</text>
<rect x="402" y="590" width="330" height="64" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="567.0" y="612.1" font-size="11" text-anchor="middle" fill="#1F2937">Activity writer</text><text x="567.0" y="625.9" font-size="11" text-anchor="middle" fill="#1F2937">Gemini through a FastAPI service</text><text x="567.0" y="639.6" font-size="11" text-anchor="middle" fill="#1F2937">writes draft activities</text>
<rect x="402" y="666" width="330" height="64" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="567.0" y="688.1" font-size="11" text-anchor="middle" fill="#1F2937">Adaptive recommender</text><text x="567.0" y="701.9" font-size="11" text-anchor="middle" fill="#1F2937">formulas only, FastAPI on Render</text><text x="567.0" y="715.6" font-size="11" text-anchor="middle" fill="#1F2937">updates the profile, suggests next</text>
<rect x="402" y="742" width="330" height="64" rx="7" fill="#FFF0DC" stroke="#E8A04F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="567.0" y="771.0" font-size="11" text-anchor="middle" fill="#1F2937">Gmail API (OAuth)</text><text x="567.0" y="784.7" font-size="11" text-anchor="middle" fill="#1F2937">sends confirmation and reset emails</text>
<rect x="20" y="616" width="354" height="106" rx="7" fill="#F3F5F8" stroke="#B8C0CC" stroke-width="1.5"/><text x="197.0" y="659.1" font-size="11" text-anchor="middle" fill="#1F2937">Safety: HTTPS, security headers, rate limits, role checks on every</text><text x="197.0" y="672.9" font-size="11" text-anchor="middle" fill="#1F2937">route, PINs and passwords hashed, nothing sensitive in the address,</text><text x="197.0" y="686.6" font-size="11" text-anchor="middle" fill="#1F2937">no card numbers stored.</text>
<rect x="20" y="736" width="354" height="108" rx="7" fill="#FFF3D6" stroke="#E0B04A" stroke-width="1.5"/><text x="197.0" y="780.1" font-size="11" text-anchor="middle" fill="#1F2937">Free hosting limits: the server and the three AI services sleep when</text><text x="197.0" y="793.9" font-size="11" text-anchor="middle" fill="#1F2937">idle (about a minute to wake). The page wakes them from the</text><text x="197.0" y="807.6" font-size="11" text-anchor="middle" fill="#1F2937">browser; the server waits for them.</text>
