<rect x="30" y="234" width="340" height="66" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="200.0" y="257.1" font-size="11" text-anchor="middle" fill="#1F2937">Phone app (version 0.5.4)</text><text x="200.0" y="270.9" font-size="11" text-anchor="middle" fill="#1F2937">React Native with Expo SDK 57, React 19, TypeScript</text><text x="200.0" y="284.6" font-size="11" text-anchor="middle" fill="#1F2937">Android 7 or newer; scans QR cards; records audio</text>
<rect x="390" y="234" width="340" height="66" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="560.0" y="257.1" font-size="11" text-anchor="middle" fill="#1F2937">Website</text><text x="560.0" y="270.9" font-size="11" text-anchor="middle" fill="#1F2937">Laravel Blade pages with plain JavaScript</text><text x="560.0" y="284.6" font-size="11" text-anchor="middle" fill="#1F2937">Chrome, Edge or Firefox; all four roles</text>
<rect x="28" y="368" width="168" height="66" rx="7" fill="#E4F4F1" stroke="#79BDB5" stroke-width="1.5"/><text x="112.0" y="391.1" font-size="11" text-anchor="middle" fill="#1F2937">Laravel 13</text><text x="112.0" y="404.9" font-size="11" text-anchor="middle" fill="#1F2937">web pages and forms</text><text x="112.0" y="418.6" font-size="11" text-anchor="middle" fill="#1F2937">session sign in</text>
<rect x="208" y="368" width="168" height="66" rx="7" fill="#E4F4F1" stroke="#79BDB5" stroke-width="1.5"/><text x="292.0" y="391.1" font-size="11" text-anchor="middle" fill="#1F2937">JSON API for the phone</text><text x="292.0" y="404.9" font-size="11" text-anchor="middle" fill="#1F2937">Sanctum tokens</text><text x="292.0" y="418.6" font-size="11" text-anchor="middle" fill="#1F2937">token fence by role</text>
<rect x="388" y="368" width="168" height="66" rx="7" fill="#E4F4F1" stroke="#79BDB5" stroke-width="1.5"/><text x="472.0" y="391.1" font-size="11" text-anchor="middle" fill="#1F2937">Rule engine (services)</text><text x="472.0" y="404.9" font-size="11" text-anchor="middle" fill="#1F2937">progression, patterns,</text><text x="472.0" y="418.6" font-size="11" text-anchor="middle" fill="#1F2937">fit, alerts, word bank</text>
<rect x="568" y="368" width="166" height="66" rx="7" fill="#E4F4F1" stroke="#79BDB5" stroke-width="1.5"/><text x="651.0" y="391.1" font-size="11" text-anchor="middle" fill="#1F2937">Background worker</text><text x="651.0" y="404.9" font-size="11" text-anchor="middle" fill="#1F2937">queue in the database</text><text x="651.0" y="418.6" font-size="11" text-anchor="middle" fill="#1F2937">writes AI drafts</text>
