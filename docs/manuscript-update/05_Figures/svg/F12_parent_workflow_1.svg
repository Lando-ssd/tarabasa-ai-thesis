<rect x="25.0" y="203.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="235.2" font-size="12" text-anchor="middle" fill="#1F2937">Sign up: name, email, password</text>
<rect x="354.7777777777778" y="203.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="235.2" font-size="12" text-anchor="middle" fill="#1F2937">Check the form and email domain; send confirmation link</text>
<rect x="25.0" y="283.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="315.2" font-size="12" text-anchor="middle" fill="#1F2937">Confirm the email, then sign in</text>
<rect x="354.7777777777778" y="283.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="315.2" font-size="12" text-anchor="middle" fill="#1F2937">Check the password; limit wrong tries</text>
<rect x="25.0" y="363.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="387.7" font-size="12" text-anchor="middle" fill="#1F2937">Add a child: name, grade, character, reading stage,</text><text x="174.9" y="402.7" font-size="12" text-anchor="middle" fill="#1F2937">home language, interests</text>
<rect x="354.7777777777778" y="363.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="395.2" font-size="12" text-anchor="middle" fill="#1F2937">Keep the profile; guess the starting step</text>
<rect x="25.0" y="443.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="475.2" font-size="12" text-anchor="middle" fill="#1F2937">Answer 3 questions for the grade; set the 4 digit PIN</text>
<rect x="354.7777777777778" y="443.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="467.7" font-size="12" text-anchor="middle" fill="#1F2937">Create the learner and Learner Code (with check digit); keep the</text><text x="544.9" y="482.7" font-size="12" text-anchor="middle" fill="#1F2937">PIN hashed</text>
<rect x="25.0" y="523.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="555.2" font-size="12" text-anchor="middle" fill="#1F2937">Print or show the learner card with QR code</text>
<rect x="354.7777777777778" y="523.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="555.2" font-size="12" text-anchor="middle" fill="#1F2937">Draw the QR here; it holds only the code, never the PIN</text>
<rect x="25.0" y="603.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="635.2" font-size="12" text-anchor="middle" fill="#1F2937">Link an existing child: code and the child&#x27;s PIN</text>
<rect x="354.7777777777778" y="603.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="635.2" font-size="12" text-anchor="middle" fill="#1F2937">Check the PIN; limit wrong tries; tell the other guardians</text>
<rect x="25.0" y="683.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="707.7" font-size="12" text-anchor="middle" fill="#1F2937">Child forgot the PIN: make a new one (password</text><text x="174.9" y="722.7" font-size="12" text-anchor="middle" fill="#1F2937">needed)</text>
<rect x="354.7777777777778" y="683.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="707.7" font-size="12" text-anchor="middle" fill="#1F2937">Apply the rules (max 3 a day); end the child&#x27;s sign ins; tell the other</text><text x="544.9" y="722.7" font-size="12" text-anchor="middle" fill="#1F2937">guardians</text>
<rect x="25.0" y="763.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="795.2" font-size="12" text-anchor="middle" fill="#1F2937">Remove a child&#x27;s profile (password needed)</text>
<polygon points="544.8888888888889,843.0 664.8888888888889,871.0 544.8888888888889,899.0 424.8888888888889,871.0" fill="#FFF3D6" stroke="#E0B04A" stroke-width="1.6"/><text x="544.9" y="875.2" font-size="12" text-anchor="middle" fill="#1F2937">Another guardian linked?</text>
<rect x="25.0" y="843.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="875.2" font-size="12" text-anchor="middle" fill="#1F2937">Only you are unlinked; the child stays</text>
<rect x="354.7777777777778" y="923.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="955.2" font-size="12" text-anchor="middle" fill="#1F2937">Delete the child and every record</text>
