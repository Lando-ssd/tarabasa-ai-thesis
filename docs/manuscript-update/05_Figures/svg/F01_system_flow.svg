<rect x="188.60439560439562" y="608.0" width="156.94505494505495" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="267.1" y="632.7" font-size="12" text-anchor="middle" fill="#1F2937">Assign to learner, class or</text><text x="267.1" y="647.7" font-size="12" text-anchor="middle" fill="#1F2937">reading group</text>
