<rect x="375.5494505494505" y="678.0" width="133.60439560439562" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="442.4" y="702.7" font-size="12" text-anchor="middle" fill="#1F2937">Scan card or type</text><text x="442.4" y="717.7" font-size="12" text-anchor="middle" fill="#1F2937">code; enter PIN</text>
<rect x="539.1538461538462" y="678.0" width="195.84615384615384" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="637.1" y="702.7" font-size="12" text-anchor="middle" fill="#1F2937">Check code and PIN; first</text><text x="637.1" y="717.7" font-size="12" text-anchor="middle" fill="#1F2937">reading check if not done</text>
