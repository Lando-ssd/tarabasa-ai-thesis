<rect x="539.1538461538462" y="468.0" width="195.84615384615384" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="637.1" y="492.7" font-size="12" text-anchor="middle" fill="#1F2937">Check grade and reading level;</text><text x="637.1" y="507.7" font-size="12" text-anchor="middle" fill="#1F2937">tell the parent</text>
