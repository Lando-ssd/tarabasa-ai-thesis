<polygon points="544.8888888888889,288.0 669.8888888888889,316.0 544.8888888888889,344.0 419.8888888888889,316.0" fill="#FFF3D6" stroke="#E0B04A" stroke-width="1.6"/><text x="544.9" y="320.2" font-size="12" text-anchor="middle" fill="#1F2937">Grade is one you handle?</text>
<rect x="25.0" y="288.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="312.7" font-size="12" text-anchor="middle" fill="#1F2937">Ask the Admin to add the grade (see Teacher</text><text x="174.9" y="327.7" font-size="12" text-anchor="middle" fill="#1F2937">workflow 1)</text>
<rect x="354.7777777777778" y="370.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="402.2" font-size="12" text-anchor="middle" fill="#1F2937">Save the class</text>
<rect x="25.0" y="452.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="476.7" font-size="12" text-anchor="middle" fill="#1F2937">Add a learner: type the last 5 characters of the code,</text><text x="174.9" y="491.7" font-size="12" text-anchor="middle" fill="#1F2937">or scan the QR</text>
<rect x="354.7777777777778" y="452.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="484.2" font-size="12" text-anchor="middle" fill="#1F2937">Check the code as it is typed (check digit); limit wrong tries</text>
<polygon points="544.8888888888889,527.0 679.8888888888889,562.0 544.8888888888889,597.0 409.8888888888889,562.0" fill="#FFF3D6" stroke="#E0B04A" stroke-width="1.6"/><text x="544.9" y="558.7" font-size="12" text-anchor="middle" fill="#1F2937">Same grade, reading level fits,</text><text x="544.9" y="573.7" font-size="12" text-anchor="middle" fill="#1F2937">not in another class?</text>
<rect x="25.0" y="534.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="566.2" font-size="12" text-anchor="middle" fill="#1F2937">See the reason; the Add button stays off</text>
<rect x="354.7777777777778" y="616.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="648.2" font-size="12" text-anchor="middle" fill="#1F2937">Add the child to the class; tell the parents</text>
<rect x="25.0" y="698.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="730.2" font-size="12" text-anchor="middle" fill="#1F2937">Open the roster: reading groups, tags, learner profile</text>
<rect x="354.7777777777778" y="698.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="722.7" font-size="12" text-anchor="middle" fill="#1F2937">Group the class by reading level; show what the parent shared and</text><text x="544.9" y="737.7" font-size="12" text-anchor="middle" fill="#1F2937">what suits the child</text>
<rect x="25.0" y="780.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="812.2" font-size="12" text-anchor="middle" fill="#1F2937">Move a learner to another class of the same grade</text>
<rect x="354.7777777777778" y="780.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="812.2" font-size="12" text-anchor="middle" fill="#1F2937">Check the same rules again</text>
<rect x="25.0" y="862.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="886.7" font-size="12" text-anchor="middle" fill="#1F2937">Release a learner for promotion; claim a released</text><text x="174.9" y="901.7" font-size="12" text-anchor="middle" fill="#1F2937">learner</text>
<rect x="354.7777777777778" y="862.0" width="380.22222222222223" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="544.9" y="894.2" font-size="12" text-anchor="middle" fill="#1F2937">Set grade and class from the class that claims</text>
<rect x="25.0" y="944.0" width="299.77777777777777" height="56" rx="7" fill="#E8F1FB" stroke="#7FA8D6" stroke-width="1.5"/><text x="174.9" y="976.2" font-size="12" text-anchor="middle" fill="#1F2937">Past school years stay read only</text>
