<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaraBasa AI — Grade Promotions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-50:#eef6ff; --sky-100:#dcedff;
    --blue-500:#1c7ed6; --blue-600:#0f5fae;
    --navy-900:#131f2b; --slate-600:#5b6b7a; --slate-400:#8a97a3;
    --owl-orange-600:#dd7014;
    --line:#e3ebf2; --surface:#ffffff; --bg-0:#f6faff;
    --success:#1f9e83; --success-bg:#e9f7f3;
    --purple:#7c5cd6;
    --shadow-sm:0 1px 2px rgba(19,31,43,0.06);
  }
  [data-theme="dark"]{
    --sky-50:#0c1620; --sky-100:#0f1d2b;
    --blue-500:#4d9fe8; --blue-600:#3a86cf;
    --navy-900:#eaf1f7; --slate-600:#a9b8c4; --slate-400:#7c8b98;
    --owl-orange-600:#e88420;
    --line:#20303e; --surface:#101c28; --bg-0:#0a131c;
    --success:#3fc4a4; --success-bg:#0f2620;
    --purple:#a794f0;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{
    min-height:100vh; font-family:'Inter',sans-serif; color:var(--navy-900);
    background: radial-gradient(1100px 500px at 90% -10%, var(--sky-100), transparent 55%), var(--bg-0);
    background-attachment:fixed; transition:background-color .35s ease, color .35s ease;
  }
  .shell{ max-width:760px; margin:0 auto; padding:22px 24px 64px; }
  .back-link{
    display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:var(--slate-600);
    text-decoration:none; margin-bottom:16px; cursor:pointer; background:none; border:none; padding:0; font-family:inherit;
  }
  .back-link:hover{ color:var(--blue-600); }
  h1{ font-family:'Baloo 2',sans-serif; font-size:24px; font-weight:700; margin:0 0 16px; }

  .tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .tab{ padding:9px 16px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font:700 13px/1 'Inter',sans-serif; color:var(--slate-600); cursor:pointer; }
  .tab.active{ background:var(--navy-900); color:var(--bg-0); border-color:var(--navy-900); }
  [data-theme="dark"] .tab.active{ background:var(--blue-600); border-color:var(--blue-600); color:#fff; }

  .row-card{
    display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; box-shadow:var(--shadow-sm); margin-bottom:10px; flex-wrap:wrap;
  }
  .av{ width:42px;height:42px;border-radius:13px; font-size:20px; flex-shrink:0; background:linear-gradient(155deg,#ffcf6e,var(--owl-orange-600)); display:flex;align-items:center;justify-content:center; }
  .info{ flex:1; min-width:150px; }
  .info .nm{ font-size:14px; font-weight:700; }
  .info .mt{ font-size:12.5px; color:var(--slate-600); font-weight:600; }
  .promote-btn{
    display:flex; align-items:center; gap:7px; background:var(--navy-900); color:var(--bg-0); border:none; padding:9px 16px;
    border-radius:11px; font:700 12.5px/1 'Inter',sans-serif; cursor:pointer;
  }
  [data-theme="dark"] .promote-btn{ background:var(--blue-600); color:#fff; }
  .final-year{ font-size:12px; color:var(--slate-400); font-weight:700; }

  .claim-item .grade-match{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .claim-select{
    flex:1; font:600 12.5px/1 'Inter',sans-serif; padding:8px 10px; border:1.5px solid var(--line); border-radius:9px;
    background:var(--bg-0); color:var(--navy-900);
  }
  .claim-btn{ background:var(--success); color:#fff; border:none; padding:8px 14px; border-radius:9px; font:700 12.5px/1 'Inter',sans-serif; cursor:pointer; }

  .empty-note{ text-align:center; padding:40px 20px; color:var(--slate-600); font-size:13.5px; font-weight:500; }
</style>
</head>
<body data-theme="light">
<div class="shell">
  <button class="back-link" id="backLink">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Dashboard
  </button>
  <h1>Grade Promotions</h1>

  <div class="tabs">
    <button class="tab active" data-view="release">Release Learners</button>
    <button class="tab" data-view="claim">Claim Incoming (1)</button>
  </div>

  <div id="releaseView">
    <div class="row-card">
      <div class="av">🦊</div>
      <div class="info"><div class="nm">das</div><div class="mt">Grade 2 · Beginning</div></div>
      <button class="promote-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4M21 6H8M7 22l-4-4 4-4M3 18h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Promote to Grade 3
      </button>
    </div>
    <div class="row-card">
      <div class="av">🦁</div>
      <div class="info"><div class="nm">morbos</div><div class="mt">Grade 1 · Developing</div></div>
      <button class="promote-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4M21 6H8M7 22l-4-4 4-4M3 18h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Promote to Grade 2
      </button>
    </div>
    <div class="row-card">
      <div class="av">🐰</div>
      <div class="info"><div class="nm">Juan</div><div class="mt">Grade 3 · Proficient</div></div>
      <span class="final-year">No next grade (final year)</span>
    </div>
  </div>

  <div id="claimView" style="display:none;">
    <div class="row-card claim-item" style="flex-direction:column; align-items:stretch;">
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="av">🐻</div>
        <div class="info"><div class="nm">Benidick</div><div class="mt">Released from Grade 2 by Jenny Reyes · needs Grade 3</div></div>
      </div>
      <div class="grade-match">
        <select class="claim-select">
          <option>CCS — Grade 3 · Section CCS</option>
        </select>
        <button class="claim-btn">Claim</button>
      </div>
    </div>
  </div>

  <div class="empty-note" id="emptyNote" style="display:none;">Nothing here right now.</div>
</div>

<script>
  document.getElementById('backLink').addEventListener('click', () => alert('→ Would navigate back to /teacher/dashboard'));

  const tabs = document.querySelectorAll('.tab');
  const releaseView = document.getElementById('releaseView');
  const claimView = document.getElementById('claimView');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const v = tab.dataset.view;
      releaseView.style.display = v === 'release' ? 'block' : 'none';
      claimView.style.display = v === 'claim' ? 'block' : 'none';
    });
  });

  document.querySelectorAll('.promote-btn').forEach(btn => {
    btn.addEventListener('click', () => alert('→ Would create a Pending PromotionRecord and clear this Learner\\'s classId. They stay fully Active, just unassigned from a class until claimed.'));
  });
  document.querySelectorAll('.claim-btn').forEach(btn => {
    btn.addEventListener('click', () => alert('→ Would set classId to the selected class and set gradeLevel automatically from that class — no manual grade entry anywhere'));
  });
</script>
</body>
</html>
