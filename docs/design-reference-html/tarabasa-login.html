<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaraBasa AI — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-50:#eef6ff;
    --sky-100:#dcedff;
    --blue-500:#1c7ed6;
    --blue-600:#0f5fae;
    --blue-700:#0a3d73;
    --navy-900:#131f2b;
    --slate-600:#5b6b7a;
    --slate-400:#8a97a3;
    --owl-orange-400:#f5a544;
    --owl-orange-500:#ef8d2a;
    --owl-orange-600:#dd7014;
    --parent-teal:#1f9e83;
    --line:#e3ebf2;
    --surface:#ffffff;
    --bg-0:#f6faff;
    --danger:#d64545;
    --danger-bg:#fdecec;
    --shadow-sm:0 1px 2px rgba(19,31,43,0.06);
    --shadow-card:0 30px 60px -30px rgba(15,60,110,0.28), 0 6px 16px -8px rgba(15,60,110,0.12);
  }
  [data-theme="dark"]{
    --sky-50:#0c1620;
    --sky-100:#0f1d2b;
    --blue-500:#4d9fe8;
    --blue-600:#3a86cf;
    --blue-700:#7fc0ff;
    --navy-900:#eaf1f7;
    --slate-600:#a9b8c4;
    --slate-400:#7c8b98;
    --owl-orange-400:#f5a544;
    --owl-orange-500:#f0983a;
    --owl-orange-600:#e88420;
    --parent-teal:#3fc4a4;
    --line:#20303e;
    --surface:#101c28;
    --bg-0:#0a131c;
    --danger:#ff6b6b;
    --danger-bg:#2a1414;
    --shadow-card:0 30px 60px -30px rgba(0,0,0,0.6), 0 6px 16px -8px rgba(0,0,0,0.4);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:var(--navy-900);
    background:
      radial-gradient(1100px 620px at 88% -10%, var(--sky-100), transparent 60%),
      radial-gradient(900px 500px at -10% 108%, var(--sky-100), transparent 55%),
      var(--bg-0);
    background-attachment:fixed;
    transition:background-color .35s ease, color .35s ease;
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
  }

  .topbar{
    position:fixed; top:22px; right:24px; display:flex; gap:10px;
  }
  .theme-toggle{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line);
    padding:7px 14px 7px 7px; border-radius:999px; cursor:pointer;
    font:600 13px/1 'Inter',sans-serif; color:var(--slate-600);
    box-shadow:var(--shadow-sm);
  }
  .theme-toggle .dot{
    width:22px;height:22px;border-radius:50%;
    background:linear-gradient(145deg, var(--owl-orange-400), var(--owl-orange-600));
    display:flex;align-items:center;justify-content:center;font-size:12px;
  }
  [data-theme="dark"] .theme-toggle .dot{ background:linear-gradient(145deg,#3a86cf,#0f5fae); }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13.5px; font-weight:700; color:var(--slate-600);
    text-decoration:none; margin-bottom:18px; cursor:pointer;
    background:none; border:none; padding:0; font-family:inherit;
  }
  .back-link:hover{ color:var(--blue-600); }
  .back-link svg{ flex-shrink:0; }

  .card-outer{ width:100%; max-width:412px; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:var(--shadow-card);
    padding:34px 32px 30px;
  }

  .logo-lockup{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .logo-badge{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(155deg, var(--blue-500), var(--blue-700));
    display:flex;align-items:center;justify-content:center; flex-shrink:0;
    box-shadow:0 6px 14px -5px rgba(15,95,174,0.55);
  }
  .wordmark{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:19px; color:var(--navy-900); }
  .wordmark span{ color:var(--owl-orange-500); }

  .role-badge{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--sky-50); border:1px solid var(--line);
    padding:6px 12px 6px 8px; border-radius:999px; margin-bottom:18px;
  }
  .role-badge .icon{
    width:22px;height:22px;border-radius:7px; flex-shrink:0;
    display:flex;align-items:center;justify-content:center; color:#fff;
  }
  .role-badge .icon.teacher{ background:linear-gradient(150deg,var(--blue-500),var(--blue-700)); }
  .role-badge span.label{ font-size:12.5px; font-weight:700; color:var(--slate-600); }
  .role-badge b{ color:var(--navy-900); font-weight:800; }

  h1{
    font-family:'Baloo 2',sans-serif; font-size:25px; font-weight:700;
    margin:0 0 4px; color:var(--navy-900);
  }
  .sub{ margin:0 0 26px; font-size:14px; color:var(--slate-600); font-weight:500; }

  form{ display:flex; flex-direction:column; gap:16px; }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:13px; font-weight:700; color:var(--navy-900); }
  .input-wrap{ position:relative; }
  .input-wrap svg.leading{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    color:var(--slate-400); pointer-events:none;
  }
  input[type="text"], input[type="email"], input[type="password"]{
    width:100%; font:500 14.5px/1 'Inter',sans-serif;
    padding:13px 14px 13px 40px;
    border:1.5px solid var(--line); border-radius:12px;
    background:var(--bg-0); color:var(--navy-900);
    outline:none; transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  input::placeholder{ color:var(--slate-400); font-weight:500; }
  input:focus{
    border-color:var(--blue-500); background:var(--surface);
    box-shadow:0 0 0 4px rgba(28,126,214,0.14);
  }
  input.error{ border-color:var(--danger); }
  input.error:focus{ box-shadow:0 0 0 4px rgba(214,69,69,0.14); }

  .toggle-visibility{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; padding:6px;
    color:var(--slate-400); display:flex; border-radius:6px;
  }
  .toggle-visibility:hover{ color:var(--slate-600); }

  .error-msg{
    display:none; align-items:center; gap:6px;
    font-size:12.5px; font-weight:600; color:var(--danger);
  }
  .error-msg.show{ display:flex; }

  .form-error-banner{
    display:none; align-items:flex-start; gap:10px;
    background:var(--danger-bg); border:1px solid rgba(214,69,69,0.25);
    padding:11px 13px; border-radius:12px; font-size:13px; font-weight:600;
    color:var(--danger); margin-bottom:2px;
  }
  .form-error-banner.show{ display:flex; }
  .form-error-banner svg{ flex-shrink:0; margin-top:1px; }

  .row-between{ display:flex; align-items:center; justify-content:space-between; margin-top:-4px; }
  .remember{ display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--slate-600); cursor:pointer; user-select:none; }
  .remember input{ width:15px; height:15px; accent-color:var(--blue-500); cursor:pointer; }
  .forgot{ font-size:13px; font-weight:700; color:var(--blue-600); text-decoration:none; }
  .forgot:hover{ text-decoration:underline; }

  .submit-btn{
    margin-top:6px;
    width:100%; padding:14px; border:none; border-radius:12px;
    background:linear-gradient(155deg, var(--blue-500), var(--blue-700));
    color:#fff; font:700 15px/1 'Inter',sans-serif; cursor:pointer;
    box-shadow:0 12px 22px -10px rgba(15,95,174,0.55);
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .submit-btn:hover{ transform:translateY(-1px); box-shadow:0 16px 26px -10px rgba(15,95,174,0.6); }
  .submit-btn:active{ transform:translateY(0); }
  .submit-btn:disabled{ opacity:.75; cursor:not-allowed; transform:none; }

  .spinner{
    width:16px;height:16px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.4); border-top-color:#fff;
    animation:spin .7s linear infinite; display:none;
  }
  .submit-btn.loading .spinner{ display:inline-block; }
  .submit-btn.loading .btn-label{ display:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .helper-note{
    text-align:center; font-size:12.5px; color:var(--slate-400); font-weight:500; margin-top:18px;
  }

  @media (prefers-reduced-motion: reduce){
    .submit-btn, .spinner{ transition:none; animation-duration:1.4s; }
  }
</style>
</head>
<body data-theme="light">

<div class="topbar">
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <span class="dot" id="themeDot">☀️</span>
    <span id="themeLabel">Light mode</span>
  </button>
</div>

<div class="card-outer">
  <button class="back-link" id="backLink">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to role select
  </button>

  <div class="card">
    <div class="logo-lockup">
      <div class="logo-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M4 4C4 4 7 3 9 5.5C9.6 6.3 10 7.5 10 9V19C10 19 8 17 4 17.5V4Z" fill="white"/>
          <path d="M20 4C20 4 17 3 15 5.5C14.4 6.3 14 7.5 14 9V19C14 19 16 17 20 17.5V4Z" fill="white" fill-opacity="0.85"/>
        </svg>
      </div>
      <span class="wordmark">TaraBasa<span>AI</span></span>
    </div>

    <div class="role-badge" id="roleBadge">
      <span class="icon teacher" id="roleIcon">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 3L2 8l10 5 8-4.2V15h1V8L12 3z" fill="currentColor"/></svg>
      </span>
      <span class="label">Signing in as <b id="roleName">Teacher</b></span>
    </div>

    <h1>Welcome back</h1>
    <p class="sub">Enter your details to access your dashboard.</p>

    <form id="loginForm" novalidate>
      <div class="form-error-banner" id="formBanner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>That email and password don't match. Please try again.</span>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <svg class="leading" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 6l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input type="email" id="email" placeholder="you@school.edu.ph" autocomplete="username" required>
        </div>
        <span class="error-msg" id="emailError">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Enter a valid email address
        </span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="leading" width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8"/></svg>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required style="padding-right:40px;">
          <button type="button" class="toggle-visibility" id="togglePw" aria-label="Show password">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" id="eyeIcon"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
        </div>
        <span class="error-msg" id="pwError">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Password is required
        </span>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="remember">
          Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-label">Sign in</span>
        <span class="spinner"></span>
      </button>
    </form>
  </div>

  <p class="helper-note">Trouble signing in? Contact your school's TaraBasa admin.</p>
</div>

<script>
  // ---- theme toggle ----
  const toggle = document.getElementById('themeToggle');
  const dot = document.getElementById('themeDot');
  const label = document.getElementById('themeLabel');
  const body = document.body;
  toggle.addEventListener('click', () => {
    const isDark = body.getAttribute('data-theme') === 'dark';
    body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    dot.textContent = isDark ? '☀️' : '🌙';
    label.textContent = isDark ? 'Light mode' : 'Dark mode';
  });

  // ---- back link (placeholder nav) ----
  document.getElementById('backLink').addEventListener('click', () => {
    alert('→ Would navigate back to role-select screen');
  });

  // ---- password visibility ----
  const pwInput = document.getElementById('password');
  const togglePw = document.getElementById('togglePw');
  const eyeIcon = document.getElementById('eyeIcon');
  togglePw.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    eyeIcon.innerHTML = show
      ? '<path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.2 4.2M9.9 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-3.2 4.1M6.6 6.6A15.7 15.7 0 0 0 2 12s3.5 7 10 7c1.3 0 2.5-.2 3.6-.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
      : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>';
  });

  // ---- validation + fake submit (wire to /api/auth/login later) ----
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const emailError = document.getElementById('emailError');
  const pwError = document.getElementById('pwError');
  const formBanner = document.getElementById('formBanner');
  const submitBtn = document.getElementById('submitBtn');

  function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    formBanner.classList.remove('show');
    let ok = true;

    if(!validEmail(emailInput.value)){
      emailInput.classList.add('error'); emailError.classList.add('show'); ok = false;
    } else {
      emailInput.classList.remove('error'); emailError.classList.remove('show');
    }
    if(!pwInput.value){
      pwInput.classList.add('error'); pwError.classList.add('show'); ok = false;
    } else {
      pwInput.classList.remove('error'); pwError.classList.remove('show');
    }
    if(!ok) return;

    submitBtn.classList.add('loading');
    submitBtn.disabled = true;
    // Simulated network call — replace with real fetch('/api/auth/login', ...)
    setTimeout(() => {
      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;
      alert('→ Would POST to /api/auth/login and redirect to the role dashboard');
    }, 1100);
  });
</script>
</body>
</html>
